spring.application.name=smartbusiness-backend

# ---- Base de datos (RDS MySQL en AWS) ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3309}/${DB_NAME:smartbusiness}?useSSL=true&serverTimezone=UTC&useServerPrepStmts=false&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:AshtonVera2005$}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:CAMBIA_ESTE_SECRETO_EN_PRODUCCION_1234567890}
app.jwt.expiration-ms=86400000

server.port=8080

# ---- CORS ----
# Dominio(s) del frontend permitidos, separados por coma (sin barra final).
# En AWS: la URL de CloudFront, y/o tu dominio propio.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
